name: Sign Commits

on:
  push:
    branches: [master]

# The workflow token is a fallback when the dedicated signing App's
# installation lacks write access. The SSH key remains the signing identity.
permissions:
  contents: write

jobs:
  sign:
    if: github.actor == 'sezgynus'
    runs-on: ubuntu-latest

    steps:
      - name: Request writable Signing Bot token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SIGNING_APP_ID }}
          private-key: ${{ secrets.SIGNING_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout without stored credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Install signing key
        env:
          SIGNING_KEY: ${{ secrets.COMMIT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SIGNING_KEY" > ~/.ssh/github_actions_signing
          chmod 600 ~/.ssh/github_actions_signing
          git config --local user.name "Sezgin AÇIKGÖZ"
          git config --local user.email "sezginacikgoz@mail.com"
          git config --local gpg.format ssh
          git config --local user.signingkey ~/.ssh/github_actions_signing
          git config --local commit.gpgsign true

      - name: Check existing signature
        id: signature
        run: |
          if git cat-file commit HEAD | grep -q '^gpgsig '; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign and push with safe fallback
        id: signed
        if: steps.signature.outputs.signed == 'false'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          ACTIONS_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git commit --amend --no-edit -S

          # The token is passed only via an environment variable to an
          # ephemeral askpass script; it is never stored in the remote URL.
          ASKPASS="$RUNNER_TEMP/revive-git-askpass"
          cat > "$ASKPASS" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$PUSH_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$ASKPASS"
          export GIT_ASKPASS="$ASKPASS"
          export GIT_TERMINAL_PROMPT=0

          if [ -n "$APP_TOKEN" ]; then
            export PUSH_TOKEN="$APP_TOKEN"
            if git push --force-with-lease origin "HEAD:refs/heads/$TARGET_BRANCH"; then
              echo "auth=app" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::Signing App push was rejected; retrying with the workflow token"
          else
            echo "::warning::Signing App could not issue a write-capable token; using workflow token"
          fi

          export PUSH_TOKEN="$ACTIONS_TOKEN"
          git push --force-with-lease origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "auth=actions" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN pushes do not trigger push-based CI. Explicit dispatch
      # tests the exact signed commit after the fallback has updated master.
      - name: Run CI for signed commit
        if: steps.signed.outputs.auth == 'actions'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: gh workflow run tests.yml --ref "$TARGET_BRANCH"
